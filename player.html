<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BestTube Player</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "YouTube Noto", Roboto, Arial, Helvetica, sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* Player container */
        #bestTube-player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* Video container */
        #bestTube-video-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        #bestTube-video-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Controls overlay */
        #bestTube-controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #bestTube-controls-overlay:hover {
            opacity: 1;
        }

        /* Top controls */
        #bestTube-top-controls {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            pointer-events: auto;
        }

        #bestTube-fullscreen-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        #bestTube-fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        /* Middle controls (play/pause) */
        #bestTube-middle-controls {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        #bestTube-play-pause-btn {
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        #bestTube-play-pause-btn:hover {
            transform: scale(1.1);
        }

        #bestTube-play-pause-btn svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        /* Bottom controls */
        #bestTube-bottom-controls {
            padding: 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            pointer-events: auto;
        }

        /* Progress bar */
        #bestTube-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #bestTube-progress-bar {
            height: 100%;
            background: #ff0000;
            border-radius: 2px;
            width: 0%;
            position: relative;
        }

        #bestTube-progress-bar::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #bestTube-progress-container:hover #bestTube-progress-bar::after {
            opacity: 1;
        }

        /* Time display */
        #bestTube-time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            opacity: 0.9;
        }

        /* Control buttons */
        #bestTube-control-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .bestTube-control-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bestTube-control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .bestTube-control-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        #bestTube-volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #bestTube-volume-slider {
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
        }

        #bestTube-volume-fill {
            height: 100%;
            background: white;
            border-radius: 2px;
            width: 100%;
        }

        /* Duration and current time */
        #bestTube-duration {
            opacity: 0.7;
        }

        /* Keyboard shortcuts info */
        #bestTube-keyboard-shortcuts {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #bestTube-keyboard-shortcuts.show {
            opacity: 1;
            pointer-events: auto;
        }

        .shortcut-item {
            margin: 5px 0;
        }

        .shortcut-key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
        }

        /* Loading indicator */
        #bestTube-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ff0000;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="bestTube-player-container">
        <div id="bestTube-video-container">
            <iframe id="bestTube-video-iframe" frameborder="0" allowfullscreen></iframe>
        </div>
        
        <div id="bestTube-controls-overlay">
            <div id="bestTube-top-controls">
                <button id="bestTube-fullscreen-btn" title="Fullscreen (f)">⛶</button>
            </div>
            
            <div id="bestTube-middle-controls">
                <button id="bestTube-play-pause-btn" title="Play/Pause (k or space)">
                    <svg viewBox="0 0 24 24">
                        <path id="play-icon" d="M8 5v14l11-7z"/>
                        <path id="pause-icon" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" style="display: none;"/>
                    </svg>
                </button>
            </div>
            
            <div id="bestTube-bottom-controls">
                <div id="bestTube-progress-container">
                    <div id="bestTube-progress-bar"></div>
                </div>
                
                <div id="bestTube-time-display">
                    <span id="bestTube-current-time">0:00</span>
                    <span id="bestTube-duration">0:00</span>
                </div>
                
                <div id="bestTube-control-buttons">
                    <button class="bestTube-control-btn" id="bestTube-rewind-btn" title="Rewind 5s (←)">
                        <svg viewBox="0 0 24 24">
                            <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
                        </svg>
                    </button>
                    
                    <button class="bestTube-control-btn" id="bestTube-play-pause-small" title="Play/Pause">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path id="play-icon-small" d="M8 5v14l11-7z"/>
                            <path id="pause-icon-small" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" style="display: none;"/>
                        </svg>
                    </button>
                    
                    <button class="bestTube-control-btn" id="bestTube-forward-btn" title="Forward 5s (→)">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
                        </svg>
                    </button>
                    
                    <div id="bestTube-volume-container">
                        <button class="bestTube-control-btn" id="bestTube-volume-btn" title="Mute (m)">
                            <svg viewBox="0 0 24 24">
                                <path id="volume-high" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                <path id="volume-low" d="M3 9v6h4l5 5V4L7 9H3z" style="display: none;"/>
                                <path id="volume-mute" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3z" style="display: none;"/>
                            </svg>
                        </button>
                        
                        <div id="bestTube-volume-slider">
                            <div id="bestTube-volume-fill"></div>
                        </div>
                    </div>
                    
                    <button class="bestTube-control-btn" id="bestTube-settings-btn" title="Settings">
                        <svg viewBox="0 0 24 24">
                            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div id="bestTube-loading"></div>
    </div>
    
    <div id="bestTube-keyboard-shortcuts">
        <div class="shortcut-item"><span class="shortcut-key">K</span> or <span class="shortcut-key">Space</span> Play/Pause</div>
        <div class="shortcut-item"><span class="shortcut-key">F</span> Fullscreen</div>
        <div class="shortcut-item"><span class="shortcut-key">M</span> Mute</div>
        <div class="shortcut-item"><span class="shortcut-key">←</span> / <span class="shortcut-key">→</span> Seek 5s</div>
        <div class="shortcut-item"><span class="shortcut-key">↑</span> / <span class="shortcut-key">↓</span> Volume</div>
    </div>

    <script>
        // Player state
        let player = null;
        let playerState = -1; // -1: unstarted, 0: ended, 1: playing, 2: paused, 3: buffering, 5: video cued
        let currentTime = 0;
        let duration = 0;
        let volume = 100;
        let isMuted = false;
        let isFullscreen = false;
        let isPlaying = false;
        let showShortcutsTimeout = null;
        
        // Get video ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v') || 'dQw4w9WgXcQ'; // Default video
        const startTime = parseInt(urlParams.get('t') || '0');
        
        // YouTube API callback
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('bestTube-video-iframe', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }
        
        function onPlayerReady(event) {
            console.log('YouTube player ready');
            
            // Set initial volume and time
            player.setVolume(volume);
            if (isMuted) player.mute();
            
            if (startTime > 0) {
                setTimeout(() => {
                    player.seekTo(startTime, true);
                }, 500);
            }
            
            // Update duration
            duration = player.getDuration();
            updateDurationDisplay();
            
            // Start updating progress
            setInterval(updateProgress, 100);
            
            // Hide loading indicator
            document.getElementById('bestTube-loading').style.display = 'none';
        }
        
        function onPlayerStateChange(event) {
            playerState = event.data;
            
            switch(playerState) {
                case YT.PlayerState.PLAYING:
                    isPlaying = true;
                    updatePlayPauseButtons(true);
                    break;
                case YT.PlayerState.PAUSED:
                    isPlaying = false;
                    updatePlayPauseButtons(false);
                    break;
                case YT.PlayerState.ENDED:
                    isPlaying = false;
                    updatePlayPauseButtons(false);
                    break;
                case YT.PlayerState.BUFFERING:
                    // Show loading indicator
                    document.getElementById('bestTube-loading').style.display = 'block';
                    break;
                case YT.PlayerState.CUED:
                    // Hide loading indicator
                    document.getElementById('bestTube-loading').style.display = 'none';
                    break;
            }
        }
        
        function onPlayerError(event) {
            console.error('YouTube player error:', event.data);
            document.getElementById('bestTube-loading').style.display = 'none';
        }
        
        // Update progress bar and time display
        function updateProgress() {
            if (player && player.getCurrentTime) {
                currentTime = player.getCurrentTime();
                const progressPercent = (currentTime / duration) * 100;
                
                document.getElementById('bestTube-progress-bar').style.width = progressPercent + '%';
                document.getElementById('bestTube-current-time').textContent = formatTime(currentTime);
            }
        }
        
        function updateDurationDisplay() {
            document.getElementById('bestTube-duration').textContent = formatTime(duration);
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                return `${minutes}:${secs.toString().padStart(2, '0')}`;
            }
        }
        
        // Control functions
        function togglePlayPause() {
            if (!player) return;
            
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }
        
        function updatePlayPauseButtons(playing) {
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const playIconSmall = document.getElementById('play-icon-small');
            const pauseIconSmall = document.getElementById('pause-icon-small');
            
            if (playing) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playIconSmall.style.display = 'none';
                pauseIconSmall.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playIconSmall.style.display = 'block';
                pauseIconSmall.style.display = 'none';
            }
        }
        
        function seekTo(time) {
            if (player) {
                player.seekTo(time, true);
            }
        }
        
        function seekRelative(seconds) {
            if (player) {
                const newTime = Math.max(0, Math.min(currentTime + seconds, duration));
                seekTo(newTime);
            }
        }
        
        function toggleMute() {
            if (!player) return;
            
            if (isMuted) {
                player.unMute();
                updateVolumeIcon(volume > 0);
            } else {
                player.mute();
                updateVolumeIcon(false);
            }
            
            isMuted = !isMuted;
        }
        
        function setVolume(newVolume) {
            if (!player) return;
            
            volume = Math.max(0, Math.min(newVolume, 100));
            player.setVolume(volume);
            
            updateVolumeIcon(volume > 0);
            updateVolumeDisplay();
            
            if (volume === 0) {
                player.mute();
                isMuted = true;
            } else if (isMuted) {
                player.unMute();
                isMuted = false;
            }
        }
        
        function updateVolumeIcon(hasVolume) {
            const volumeHigh = document.getElementById('volume-high');
            const volumeLow = document.getElementById('volume-low');
            const volumeMute = document.getElementById('volume-mute');
            
            if (isMuted || volume === 0) {
                volumeHigh.style.display = 'none';
                volumeLow.style.display = 'none';
                volumeMute.style.display = 'block';
            } else if (volume < 50) {
                volumeHigh.style.display = 'none';
                volumeLow.style.display = 'block';
                volumeMute.style.display = 'none';
            } else {
                volumeHigh.style.display = 'block';
                volumeLow.style.display = 'none';
                volumeMute.style.display = 'none';
            }
        }
        
        function updateVolumeDisplay() {
            const volumeFill = document.getElementById('bestTube-volume-fill');
            volumeFill.style.width = volume + '%';
        }
        
        function toggleFullscreen() {
            const container = document.getElementById('bestTube-player-container');
            
            if (!isFullscreen) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.mozRequestFullScreen) { // Firefox
                    container.mozRequestFullScreen();
                } else if (container.webkitRequestFullscreen) { // Chrome, Safari
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { // IE/Edge
                    container.msRequestFullscreen();
                }
                isFullscreen = true;
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
            }
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Load YouTube API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            
            // Setup controls
            setupControls();
            setupKeyboardShortcuts();
        });
        
        function setupControls() {
            // Play/Pause buttons
            document.getElementById('bestTube-play-pause-btn').addEventListener('click', togglePlayPause);
            document.getElementById('bestTube-play-pause-small').addEventListener('click', togglePlayPause);
            
            // Seek buttons
            document.getElementById('bestTube-rewind-btn').addEventListener('click', () => seekRelative(-5));
            document.getElementById('bestTube-forward-btn').addEventListener('click', () => seekRelative(5));
            
            // Fullscreen button
            document.getElementById('bestTube-fullscreen-btn').addEventListener('click', toggleFullscreen);
            
            // Volume button
            document.getElementById('bestTube-volume-btn').addEventListener('click', toggleMute);
            
            // Volume slider
            const volumeSlider = document.getElementById('bestTube-volume-slider');
            volumeSlider.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                setVolume(Math.round(percent * 100));
            });
            
            // Progress bar
            const progressContainer = document.getElementById('bestTube-progress-container');
            progressContainer.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                const time = percent * duration;
                seekTo(time);
            });
            
            // Settings button
            document.getElementById('bestTube-settings-btn').addEventListener('click', function() {
                const shortcuts = document.getElementById('bestTube-keyboard-shortcuts');
                shortcuts.classList.toggle('show');
                
                if (showShortcutsTimeout) clearTimeout(showShortcutsTimeout);
                showShortcutsTimeout = setTimeout(() => {
                    shortcuts.classList.remove('show');
                }, 5000);
            });
            
            // Fullscreen change events
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('msfullscreenchange', handleFullscreenChange);
        }
        
        function handleFullscreenChange() {
            const fullscreenBtn = document.getElementById('bestTube-fullscreen-btn');
            if (document.fullscreenElement || 
                document.mozFullScreenElement || 
                document.webkitFullscreenElement || 
                document.msFullscreenElement) {
                isFullscreen = true;
                fullscreenBtn.innerHTML = '⛶';
            } else {
                isFullscreen = false;
                fullscreenBtn.innerHTML = '⛶';
            }
        }
        
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                // Ignore shortcuts when typing in input fields
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key.toLowerCase()) {
                    case 'k':
                    case ' ':
                        e.preventDefault();
                        togglePlayPause();
                        break;
                    case 'f':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case 'm':
                        e.preventDefault();
                        toggleMute();
                        break;
                    case 'arrowleft':
                        e.preventDefault();
                        seekRelative(-5);
                        break;
                    case 'arrowright':
                        e.preventDefault();
                        seekRelative(5);
                        break;
                    case 'arrowup':
                        e.preventDefault();
                        setVolume(Math.min(volume + 10, 100));
                        break;
                    case 'arrowdown':
                        e.preventDefault();
                        setVolume(Math.max(volume - 10, 0));
                        break;
                    case '?':
                        e.preventDefault();
                        const shortcuts = document.getElementById('bestTube-keyboard-shortcuts');
                        shortcuts.classList.toggle('show');
                        
                        if (showShortcutsTimeout) clearTimeout(showShortcutsTimeout);
                        showShortcutsTimeout = setTimeout(() => {
                            shortcuts.classList.remove('show');
                        }, 5000);
                        break;
                }
            });
        }
        
        // Mouse controls for progress bar
        let isDraggingProgress = false;
        
        document.getElementById('bestTube-progress-container').addEventListener('mousedown', function(e) {
            isDraggingProgress = true;
            handleProgressClick(e);
        });
        
        document.addEventListener('mousemove', function(e) {
            if (isDraggingProgress) {
                handleProgressClick(e);
            }
        });
        
        document.addEventListener('mouseup', function() {
            isDraggingProgress = false;
        });
        
        function handleProgressClick(e) {
            const progressContainer = document.getElementById('bestTube-progress-container');
            const rect = progressContainer.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const percent = x / rect.width;
            
            const time = percent * duration;
            seekTo(time);
        }
        
        // Initialize volume display
        updateVolumeDisplay();
        updateVolumeIcon(true);
    </script>
</body>
</html>
